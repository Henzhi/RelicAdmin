server:
  port: 8080
  # H-07：接口统一版本前缀，URL 版本控制策略（/v1/admin/** 等）
  servlet:
    context-path: /v1

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB
  datasource:
    driver-class-name: ${relic.datasource.driver-class-name}
    url: jdbc:mysql://${relic.datasource.host}:${relic.datasource.port}/${relic.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${relic.datasource.username}
    password: ${relic.datasource.password}

  data:
    redis:
      host: ${relic.redis.host}
      port: ${relic.redis.port}
      password: ${relic.redis.password}
      database: ${relic.redis.database}
      ssl:
        enabled: ${relic.redis.ssl:false}
      timeout: ${relic.redis.timeout:2000ms}
      lettuce:
        pool:
          max-active: ${relic.redis.lettuce.pool.max-active:8}
          max-idle: ${relic.redis.lettuce.pool.max-idle:8}
          min-idle: ${relic.redis.lettuce.pool.min-idle:0}

  # H-06：Flyway 数据库版本化迁移
  # 新环境自动从 V1 执行全部迁移；已有环境通过 baseline-on-migrate 标记基线，不再重复执行历史脚本
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    # 关闭 Flyway 默认的 DB 连接校验与依赖检查，避免与 MyBatis 初始化顺序冲突
    validate-on-migrate: true

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.relic.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      relic:
        mapper: debug
        service: info
        controller: info

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh-CN
    enable-swagger-models: true
    swagger-model-name: 实体类列表

relic:
  # M-05：爬虫调度默认关闭（当前为演示实现，接入真实爬虫后开启）
  crawl:
    scheduler-enabled: false
  jwt:
    # 敏感密钥一律通过环境变量注入，禁止明文入库；未配置时应用启动失败（安全兜底）
    admin-secret-key: ${JWT_ADMIN_SECRET_KEY}
    # M-02：Token 有效期缩短为 8 小时（原约 833 天过长）
    admin-ttl: ${ADMIN_TOKEN_TTL:28800000}
    admin-token-name: token
    knowledge-secret-key: ${JWT_KNOWLEDGE_SECRET_KEY}
    knowledge-ttl: ${KNOWLEDGE_TOKEN_TTL:28800000}
    knowledge-token-name: token
    museum-secret-key: ${JWT_MUSEUM_SECRET_KEY}
    museum-ttl: ${MUSEUM_TOKEN_TTL:28800000}
    museum-token-name: token
    user-secret-key: ${JWT_USER_SECRET_KEY}
    user-ttl: ${USER_TOKEN_TTL:28800000}
    user-token-name: token
