name: CI

# 最小闭环：代码合并到 main / 发起 PR 时，自动执行 后端编译+测试、前端 lint+构建
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Backend compile
        run: mvn -B compile -DskipTests

      - name: Backend test
        run: mvn -B test

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relic-frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: relic-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Frontend build
        run: npm run build
